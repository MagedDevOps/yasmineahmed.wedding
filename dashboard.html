<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1A3B65" />
  <title>RSVP Sheet · Yasmine &amp; Ahmed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="dash-shell">
    <section id="loginView" class="dash-login">
      <p class="dash-kicker">Private access</p>
      <h1>RSVP list</h1>
      <p class="dash-sub">Enter your password to open the Google Sheet with every guest reply.</p>
      <form id="loginForm" class="dash-login__form">
        <label class="sr-only" for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password" required />
        <button type="submit">Open sheet</button>
        <p id="loginError" class="dash-error" hidden></p>
      </form>
    </section>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
